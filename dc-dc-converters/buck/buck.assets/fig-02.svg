<?xml version="1.0" encoding="UTF-8"?>
<!-- hand-authored figure - skeleton copied verbatim from Proqmed docs/uSockets fig-01.svg per docs/STYLE.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 498" role="img" aria-label="Buck switch-node square wave above and the resulting triangular inductor current" width="980" height="498">
<style><![CDATA[
.h2m-bg{fill:#0d1117}
*{box-sizing:border-box}
/* Printing on a dark palette wastes ink and renders badly, so print is always light. */
body{margin:0;background:#0d1117;color:#c9d1d9;
  font:15px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:38px 22px 90px}
main{max-width:1080px;margin:0 auto}
figure{margin:22px 0;background:#161b22;border:1px solid #30363d;
  border-radius:11px;padding:18px;overflow-x:auto}
figure svg{display:block;width:100%;height:auto;min-width:680px}
figcaption{color:#8b949e;font-size:12.5px;margin-top:12px;text-align:center}
/* ---- SVG theming: every colour resolves through these classes so figures re-theme. */
svg text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c9d1d9}
svg text.t{font-size:13.5px;font-weight:700;fill:#e6edf3}
svg text.s{font-size:11px;fill:#8b949e}
svg text.xs{font-size:9.5px;fill:#8b949e}
svg text.l{font-size:10.5px;fill:#8b949e}
svg text.lb{font-size:10.5px;fill:#58a6ff}
svg text.lg{font-size:10.5px;fill:#3fb950}
svg text.lr{font-size:10.5px;fill:#f85149}
svg text.lp{font-size:10.5px;fill:#bc8cff}
svg text.la{font-size:10.5px;fill:#d29922}
svg .fx-b{fill:#58a6ff}  svg .fx-g{fill:#3fb950}
svg .fx-r{fill:#f85149}   svg .fx-a{fill:#d29922}
svg .fx-p{fill:#bc8cff} svg .fx-n{fill:#8b949e}
svg .n{fill:#1a2029;stroke:#484f58;stroke-width:1.6}
svg .nb{fill:#101a2b;stroke:#58a6ff;stroke-width:2px}
svg .ng{fill:#0f1c14;stroke:#3fb950;stroke-width:2px}
svg .nr{fill:#201215;stroke:#f85149;stroke-width:2px}
svg .na{fill:#1e1a10;stroke:#d29922;stroke-width:2px}
svg .np{fill:#181228;stroke:#bc8cff;stroke-width:2px}
svg .nd{fill:#15191f;stroke:#3d444d;stroke-width:1.5;stroke-dasharray:5 4}
svg .grp{fill:none;stroke:#3d444d;stroke-width:1.4;stroke-dasharray:6 5}
svg .a{stroke:#8b949e;stroke-width:1.8;fill:none;marker-end:url(#ah)}
svg .ab{stroke:#58a6ff;stroke-width:2;fill:none;marker-end:url(#ahb)}
svg .ag{stroke:#3fb950;stroke-width:2;fill:none;marker-end:url(#ahg)}
svg .ar{stroke:#f85149;stroke-width:2;fill:none;marker-end:url(#ahr)}
svg .ap{stroke:#bc8cff;stroke-width:2;fill:none;marker-end:url(#ahp)}
svg .aa{stroke:#d29922;stroke-width:2;fill:none;marker-end:url(#aha)}
svg .wire{stroke:#8b949e;stroke-width:1.8;fill:none}
svg .wire-r{stroke:#f85149;stroke-width:2.4;fill:none;stroke-linecap:round}
svg .wire-b{stroke:#58a6ff;stroke-width:2.4;fill:none;stroke-linecap:round}
svg .wire-a{stroke:#d29922;stroke-width:2.4;fill:none;stroke-linecap:round}
svg .wire-p{stroke:#bc8cff;stroke-width:2.4;fill:none;stroke-linecap:round}
svg .wire-g{stroke:#3fb950;stroke-width:2.4;fill:none;stroke-linecap:round}
svg .axis{stroke:#8b949e;stroke-width:1.5;fill:none}
svg .grid{stroke:#30363d;stroke-width:1;fill:none;stroke-dasharray:3 4}
svg .plot-b{stroke:#58a6ff;stroke-width:2.4;fill:none;stroke-linejoin:round}
svg .plot-a{stroke:#d29922;stroke-width:2.4;fill:none;stroke-linejoin:round}
svg .plot-g{stroke:#3fb950;stroke-width:2.4;fill:none;stroke-linejoin:round}
svg .plot-r{stroke:#f85149;stroke-width:2.4;fill:none;stroke-linejoin:round}
svg .plot-p{stroke:#bc8cff;stroke-width:2.4;fill:none;stroke-linejoin:round}
svg .fill-a{fill:#d29922;opacity:0.14}
svg .fill-g{fill:#3fb950;opacity:0.14}
svg .dash{stroke-dasharray:6 5}
svg .mk-n{fill:#8b949e}  svg .mk-b{fill:#58a6ff}
svg .mk-g{fill:#3fb950}  svg .mk-r{fill:#f85149}
svg .mk-p{fill:#bc8cff} svg .mk-a{fill:#d29922}
@media (prefers-color-scheme: light){
body{background:#ffffff;color:#1f2328}
figure{background:#f6f8fa;border:1px solid #d0d7de}
figcaption{color:#57606a}
svg text{fill:#1f2328}
svg text.t{fill:#010409}
svg text.s{fill:#57606a}
svg text.xs{fill:#57606a}
svg text.l{fill:#57606a}
svg text.lb{fill:#0550ae}
svg text.lg{fill:#1a7f37}
svg text.lr{fill:#cf222e}
svg text.lp{fill:#8250df}
svg text.la{fill:#9a6700}
svg .fx-b{fill:#0550ae}
svg .fx-g{fill:#1a7f37}
svg .fx-r{fill:#cf222e}
svg .fx-a{fill:#9a6700}
svg .fx-p{fill:#8250df}
svg .fx-n{fill:#57606a}
svg .n{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.6}
svg .nb{fill:#ddf4ff;stroke:#0550ae;stroke-width:2.2px}
svg .ng{fill:#dafbe1;stroke:#1a7f37;stroke-width:2.2px}
svg .nr{fill:#ffebe9;stroke:#cf222e;stroke-width:2.2px}
svg .na{fill:#fff8c5;stroke:#9a6700;stroke-width:2.2px}
svg .np{fill:#fbefff;stroke:#8250df;stroke-width:2.2px}
svg .nd{fill:#ffffff;stroke:#afb8c1;stroke-width:1.5;stroke-dasharray:5 4}
svg .grp{fill:none;stroke:#afb8c1;stroke-width:1.4;stroke-dasharray:6 5}
svg .a{stroke:#57606a;stroke-width:1.8;fill:none;marker-end:url(#ah)}
svg .ab{stroke:#0550ae;stroke-width:2;fill:none;marker-end:url(#ahb)}
svg .ag{stroke:#1a7f37;stroke-width:2;fill:none;marker-end:url(#ahg)}
svg .ar{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#ahr)}
svg .ap{stroke:#8250df;stroke-width:2;fill:none;marker-end:url(#ahp)}
svg .aa{stroke:#9a6700;stroke-width:2;fill:none;marker-end:url(#aha)}
svg .wire{stroke:#57606a}
svg .wire-r{stroke:#cf222e}
svg .wire-b{stroke:#0550ae}
svg .wire-a{stroke:#9a6700}
svg .wire-p{stroke:#8250df}
svg .wire-g{stroke:#1a7f37}
svg .axis{stroke:#57606a}
svg .grid{stroke:#d0d7de}
svg .plot-b{stroke:#0550ae}
svg .plot-a{stroke:#9a6700}
svg .plot-g{stroke:#1a7f37}
svg .plot-r{stroke:#cf222e}
svg .plot-p{stroke:#8250df}
svg .fill-a{fill:#9a6700;opacity:0.12}
svg .fill-g{fill:#1a7f37;opacity:0.12}
svg .mk-n{fill:#57606a}
svg .mk-b{fill:#0550ae}
svg .mk-g{fill:#1a7f37}
svg .mk-r{fill:#cf222e}
svg .mk-p{fill:#8250df}
svg .mk-a{fill:#9a6700}
.h2m-bg{fill:#ffffff}
}
@media print{
body{background:#ffffff;color:#111417}
figure{background:#ffffff;border:1px solid #c3ccd5}
figure svg{min-width:0}
svg text{fill:#111417}
.h2m-bg{fill:#ffffff}
}
]]></style>
<defs>
<marker id="ah"  markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk-n"/></marker>
<marker id="ahb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk-b"/></marker>
<marker id="ahg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk-g"/></marker>
<marker id="ahr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk-r"/></marker>
<marker id="ahp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk-p"/></marker>
<marker id="aha" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk-a"/></marker>
</defs>
<rect class="h2m-bg" x="0" y="0" width="980" height="498" fill="#0d1117"/>
<text class="t" x="490" y="34" text-anchor="middle">Buck waveforms — switch node (square) drives inductor current (triangle)</text>
<text class="s" x="490" y="54" text-anchor="middle">D = 0.25 : ON a quarter of each period T, OFF the rest · 3 cycles shown</text>

<!-- ===== TOP: switch node V_x ===== -->
<text class="la" x="70" y="90" text-anchor="start">V_x (switch node)</text>
<line class="axis" x1="90" y1="98" x2="90" y2="200"/>
<line class="axis" x1="90" y1="200" x2="900" y2="200"/>
<text class="s" x="82" y="116" text-anchor="end">12</text>
<text class="s" x="82" y="204" text-anchor="end">0</text>
<line class="grid" x1="90" y1="112" x2="880" y2="112"/>
<!-- square wave: period 240px, high for 60px (D=0.25). Start x=90. high y=112, low y=200 -->
<path class="plot-a" d="M90 112 H150 V200 H330 V112 H390 V200 H570 V112 H630 V200 H810 V112 H870 V200 H880"/>
<text class="la" x="120" y="228" text-anchor="middle">ON</text>
<text class="s" x="240" y="228" text-anchor="middle">OFF</text>
<text class="la" x="360" y="228" text-anchor="middle">ON</text>
<text class="s" x="480" y="228" text-anchor="middle">OFF</text>
<text class="la" x="600" y="228" text-anchor="middle">ON</text>
<text class="s" x="720" y="228" text-anchor="middle">OFF</text>
<!-- period bracket -->
<line class="grid" x1="90" y1="242" x2="330" y2="242"/>
<text class="s" x="210" y="256" text-anchor="middle">one period T</text>
<path class="a" d="M900 200 H918"/>
<text class="s" x="905" y="216" text-anchor="start">t</text>

<!-- ===== BOTTOM: inductor current I_L (triangle) ===== -->
<text class="lb" x="70" y="298" text-anchor="start">I_L (inductor current)</text>
<line class="axis" x1="90" y1="306" x2="90" y2="440"/>
<line class="axis" x1="90" y1="440" x2="900" y2="440"/>
<!-- average (load) line -->
<line class="grid" x1="90" y1="380" x2="880" y2="380"/>
<text class="s" x="82" y="384" text-anchor="end">I_load</text>
<!-- triangle: rises during ON (steep, short), falls during OFF (gentle, long).
     ON segment 60px wide rising; OFF 180px falling. peak above avg, trough below.
     Start at trough y=400 at x=90. rise to y=360 at x=150. fall to y=400 at x=330. repeat. -->
<path class="plot-b" d="M90 400 L150 360 L330 400 L390 360 L570 400 L630 360 L810 400 L870 360 L880 363"/>
<!-- ripple band annotation -->
<line class="grid" x1="150" y1="360" x2="200" y2="360"/>
<line class="grid" x1="150" y1="400" x2="200" y2="400"/>
<text class="lb" x="238" y="384" text-anchor="middle">ΔI_L</text>
<text class="lg" x="700" y="332" text-anchor="middle">rises when ON, falls when OFF — a triangle centred on I_load</text>
<path class="a" d="M900 440 H918"/>
<text class="s" x="905" y="456" text-anchor="start">t</text>

<text class="la" x="490" y="478" text-anchor="middle">flat-topped square voltage → straight-sided triangle current: each interval is a constant-V ramp</text>
</svg>
