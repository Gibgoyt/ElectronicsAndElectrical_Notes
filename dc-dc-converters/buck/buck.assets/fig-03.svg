<rect class="h2m-bg" x="0" y="0" width="980" height="436" fill="#0d1117"/>
<text class="t" x="490" y="34" text-anchor="middle">What the output capacitor actually sees: i_C = i_L − I_load</text>
<text class="s" x="490" y="54" text-anchor="middle">the load takes the average; the capacitor swallows the leftover triangle, centred on zero</text>
<text class="lp" x="70" y="92" text-anchor="start">i_C (into the capacitor)</text>
<line class="axis" x1="90" y1="100" x2="90" y2="340"/>
<line class="axis" x1="90" y1="340" x2="900" y2="340"/>
<line class="grid" x1="90" y1="220" x2="880" y2="220"/>
<text class="s" x="82" y="224" text-anchor="end">0</text>
<text class="lp" x="82" y="150" text-anchor="end">+dI_L/2</text>
<text class="lp" x="82" y="296" text-anchor="end">−dI_L/2</text>
<path class="plot-p" d="M90 220 L165 150 L315 290 L465 150 L615 290 L765 150 L880 257"/>
<path class="fill-g" d="M90 220 L165 150 L240 220 Z"/>
<path class="fill-g" d="M390 220 L465 150 L540 220 Z"/>
<path class="fill-g" d="M690 220 L765 150 L840 220 Z"/>
<text class="lg" x="165" y="140" text-anchor="middle">cap charging (i_C &gt; 0)</text>
<text class="lg" x="500" y="384" text-anchor="middle">dQ = area of the positive triangle = ½ · (T/2) · (dI_L/2) = T·dI_L / 8</text>
<text class="s" x="300" y="316" text-anchor="middle">cap discharging (i_C &lt; 0)</text>
<path class="a" d="M900 340 H918"/>
<text class="s" x="905" y="356" text-anchor="start">t</text>
<text class="la" x="490" y="418" text-anchor="middle">that dQ on a capacitance C is a voltage ripple dV = dQ/C — which is how you pick C</text>
