<rect class="h2m-bg" x="0" y="0" width="980" height="400" fill="#0d1117"/>
<text class="t" x="490" y="34" text-anchor="middle">Same four parts, reordered — that is the whole difference</text>
<text class="s" x="490" y="54" text-anchor="middle">switch · diode · inductor · capacitor, wired two ways</text>
<rect class="nr" x="30" y="70" width="440" height="200" rx="10"/>
<text class="t" x="250" y="98" text-anchor="middle">BUCK — steps DOWN</text>
<text class="s" x="250" y="122" text-anchor="middle">order along the top: SWITCH first, then INDUCTOR</text>
<text class="lr" x="250" y="150" text-anchor="middle">V_in → [S1] → node → [L] → V_out</text>
<text class="s" x="250" y="176" text-anchor="middle">diode from node to ground · cap across output</text>
<text class="s" x="250" y="204" text-anchor="middle">inductor's left end is chopped between V_in and 0</text>
<text class="s" x="250" y="234" text-anchor="middle" style="font-size:14px">V_out = D · V_in</text>
<text class="s" x="250" y="256" text-anchor="middle">0 &lt; D &lt; 1, so V_out &lt; V_in</text>
<rect class="ng" x="510" y="70" width="440" height="200" rx="10"/>
<text class="t" x="730" y="98" text-anchor="middle">BOOST — steps UP</text>
<text class="s" x="730" y="122" text-anchor="middle">order along the top: INDUCTOR first, then SWITCH</text>
<text class="lg" x="730" y="150" text-anchor="middle">V_in → [L] → node → [D] → V_out</text>
<text class="s" x="730" y="176" text-anchor="middle">switch from node to ground · cap across output</text>
<text class="s" x="730" y="204" text-anchor="middle">inductor charges then dumps ON TOP of V_in</text>
<text class="s" x="730" y="234" text-anchor="middle" style="font-size:14px">V_out = V_in / (1−D)</text>
<text class="s" x="730" y="256" text-anchor="middle">1−D &lt; 1, so V_out &gt; V_in</text>
<rect class="na" x="30" y="286" width="920" height="70" rx="10"/>
<text class="t" x="490" y="312" text-anchor="middle">worked numbers, same spec (f=100kHz, 1A, 20% dI, 1% dV)</text>
<text class="s" x="250" y="338" text-anchor="middle">buck 12→3V:  L = 112.5 µH · C = 8.3 µF</text>
<text class="s" x="730" y="338" text-anchor="middle">boost 12→24V:  L = 300 µH · C = 20.8 µF</text>
<text class="la" x="490" y="382" text-anchor="middle">boost needs ~3× the L and ~3× the C — because the cap is on its own while the switch is ON</text>
</svg>
